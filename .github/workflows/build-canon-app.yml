# Builds the Strategi Canon tray app for macOS and Windows.
#
# - workflow_dispatch: build both, upload the zips as workflow artifacts.
# - tag v*: same, plus a GitHub release carrying both zips.
#
# The build scripts own the whole recipe (throwaway .buildvenv, Pillow-made
# icons, PyInstaller); this workflow only provides the OS, Python 3.12, and
# the zipping. setup-python's 3.12 lands first on PATH, so build-mac.sh's
# `python3` and build-windows.bat's `python` both resolve to it.
name: Build Canon app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Strategi-Canon-macos
          - os: windows-latest
            artifact: Strategi-Canon-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./canon_app/build-mac.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: canon_app\build-windows.bat

      # ditto keeps the .app's symlinks and executable bits; a plain zip of a
      # Mac .app arrives broken on the other end.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd canon_app/dist
          ditto -c -k --sequesterRsrc --keepParent "Strategi Canon.app" "${{ github.workspace }}/${{ matrix.artifact }}.zip"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "canon_app/dist/Strategi Canon" -DestinationPath "${{ github.workspace }}/${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Strategi-Canon-macos.zip
            Strategi-Canon-windows.zip
