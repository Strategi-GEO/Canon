# Builds a SELF-SUFFICIENT Strategi Canon package for macOS and Windows.
#
# - workflow_dispatch: build both, upload the zips as workflow artifacts for a
#   human to inspect. That upload is best-effort: see the continue-on-error note.
# - tag v*: build both, attach each zip DIRECTLY to a GitHub release.
#
# WHY THE TAG PATH DOES NOT GO THROUGH upload-artifact. Each package is roughly
# half a gigabyte of bundled runtimes, and the Actions ARTIFACT storage quota is
# small and shared across the org. The first tag build hit it: both legs built
# and packaged cleanly, then died on upload-artifact with "Artifact storage quota
# has been hit", which also starved the download-artifact the old release job
# depended on. Release ASSETS are stored separately and are not charged against
# that quota, so each matrix leg now uploads its own zip to the release and there
# is no artifact hop to starve. The dispatch path still uses upload-artifact, but
# best-effort, so a full quota cannot red a build that genuinely succeeded.
#
# WHAT CHANGED AND WHY. This workflow used to ship only "Strategi Canon.app".
# That app is a LAUNCHER: it starts the engine and the dashboard that live beside
# it, and tray.py's discover_repo() walks up from the executable looking for
# launcher.py and server/app.py. Shipped on its own it found neither, so a
# teammate who downloaded the release got a folder picker and a dead end. The
# release now carries the whole tree, the bundled runtimes, and the launcher
# together, so unzip-and-run is the entire setup.
#
# THE SOURCE COMES FROM `git archive`, NOT FROM THE WORKING TREE. Two reasons,
# and the first one is the important one:
#   1. SECRETS. git archive emits only TRACKED files. server/.env is gitignored
#      and therefore cannot be in the package, no matter what a runner leaves on
#      disk. A copy-the-directory step would need an exclude list that is correct
#      forever, and the first time it is not, a release ships the service key.
#   2. It also drops .venv, node_modules, .next, outputs/ and build scratch for
#      free, which is the difference between a 280 MB package and a 1.7 GB one.
#
# The runtimes (~262 MB of Node and CPython) are fetched here rather than
# committed, and they are what let the package run on a machine with neither
# installed. First launch still builds .venv and runs npm install once.
name: Build Canon app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # THE RELEASE IS GATED ON THE TESTS, and this job is the whole of that gate. It runs the suite
  # defined in tests.yml rather than a second copy of it, so the checks a release must pass are
  # the same checks every push already runs, and there is no way for the two to drift apart into
  # a tag build that is green about something the branch build is red about.
  #
  # WHY IT IS A CALL AND NOT A STEP INSIDE `build`. The build below is a macOS and Windows matrix
  # with fail-fast disabled, so a test step placed inside it would run twice, on two slow runners,
  # and a red result on one leg would leave the other still grinding through a package nobody can
  # ship. Hoisting it to its own job means the suite runs once, on one cheap runner, and `needs`
  # stops both legs before either fetches 262 MB of runtimes for a tree that already failed.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    # A red suite stops the package here, before any artifact exists to be mistaken for a good
    # one. On a tag this same job attaches the release assets, so the gate reaches the release too.
    needs: test
    # contents: write is for the release-asset upload on a tag. It is harmless on a dispatch build,
    # where the attach step does not run.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Strategi-Canon-macos
          - os: windows-latest
            artifact: Strategi-Canon-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The SAME major the app runs on: fetch_runtimes bundles Node 24.18.0, so the standalone
      # dashboard is built with it here. Building on a different major and running on 24 is the
      # kind of mismatch that works until one native addon does not.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      # THE DASHBOARD IS COMPILED HERE, ONCE, so the shipped package serves an already-built
      # dashboard instead of running `next dev` (which JIT-compiles each page on first visit) or
      # `npm install` on the user's machine. `output: standalone` (next.config.ts) emits a
      # self-contained Node server; static assets and public/ are copied in beside it, which is
      # the one manual step standalone leaves to the packager. NEXT_PUBLIC_API_BASE is baked to
      # the engine's default local port (8000): it is a browser value read at build time, so it
      # cannot be deferred to runtime, and the launcher runs the engine on that port.
      - name: Build dashboard (production, standalone)
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          npm ci
          # CANON_STANDALONE=1 turns on the standalone output (next.config.ts), which is OFF by
          # default so the Vercel build of the client dashboard is never affected. Only this
          # desktop build sets it.
          CANON_STANDALONE=1 NEXT_PUBLIC_API_BASE=http://localhost:8000 npm run build
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          test -f .next/standalone/server.js || { echo "standalone server.js was not produced"; exit 1; }

      # Downloads Node and CPython into canon_app/build_assets/runtimes, with
      # checksum verification and a smoke test. Both build scripts also call
      # this, but it runs here explicitly so the package step can rely on it
      # having happened even if a build script is changed later.
      - name: Fetch bundled runtimes
        run: python canon_app/fetch_runtimes.py

      # SINGLE-APP (macOS): stage the tree the .app will carry inside it, BEFORE the build so
      # build-mac.sh can embed and seal it. git archive for the same two reasons as the package
      # assembly below (tracked files only, so server/.env cannot ship; no .venv/node_modules
      # dead weight), then the prebuilt dashboard on top, then a stamp tray.py compares to know
      # when to re-materialize after an upgrade.
      - name: Stage Canon tree for embedding (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          TREE="$RUNNER_TEMP/canon-tree"
          mkdir -p "$TREE"
          git archive --format=tar HEAD | tar -x -C "$TREE"
          mkdir -p "$TREE/dashboard/.next"
          ditto "dashboard/.next/standalone" "$TREE/dashboard/.next/standalone"
          git rev-parse HEAD > "$TREE/.canon-tree-stamp"
          # VERSION is what app_update.current_version() reads and what the updater compares. A tag
          # gives the real number; a dispatch build has no tag, so 0.0.0 (never offers an update).
          VERSION="0.0.0"; case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}";; esac
          printf '%s\n' "$VERSION" > "$TREE/VERSION"
          test -f "$TREE/dashboard/.next/standalone/server.js" || { echo "prebuilt dashboard missing from staged tree"; exit 1; }
          test ! -e "$TREE/server/.env" || { echo "REFUSING: server/.env in staged tree"; exit 1; }
          echo "CANON_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Build launcher (macOS)
        if: runner.os == 'macOS'
        run: ./canon_app/build-mac.sh

      # SINGLE-APP (Windows): stage the tree build-windows.bat embeds beside the exe, same shape
      # as the macOS stage step. git archive (tracked files only, so no server/.env), then the
      # prebuilt dashboard, then the stamp. CANON_TREE is exported for the build step below.
      - name: Stage Canon tree for embedding (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tree = Join-Path $env:RUNNER_TEMP "canon-tree"
          New-Item -ItemType Directory -Force -Path $tree | Out-Null
          $tar = Join-Path $env:RUNNER_TEMP "source.tar"
          git archive --format=tar -o $tar HEAD
          tar -x -f $tar -C $tree
          New-Item -ItemType Directory -Force -Path (Join-Path $tree "dashboard\.next") | Out-Null
          Copy-Item -Recurse -Force "dashboard\.next\standalone" (Join-Path $tree "dashboard\.next\standalone")
          git rev-parse HEAD | Out-File -Encoding ascii -NoNewline (Join-Path $tree ".canon-tree-stamp")
          # VERSION for app_update.current_version(): the tag number, or 0.0.0 on a dispatch build.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME -replace '^v','' } else { '0.0.0' }
          $version | Out-File -Encoding ascii -NoNewline (Join-Path $tree "VERSION")
          if (!(Test-Path (Join-Path $tree "dashboard\.next\standalone\server.js"))) { throw "prebuilt dashboard missing from staged tree" }
          if (Test-Path (Join-Path $tree "server\.env")) { throw "REFUSING: server/.env in staged tree" }
          "CANON_TREE=$tree" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: canon_app\build-windows.bat

      # ditto, not cp or zip, at every step that moves the .app or the runtimes:
      # both contain symlinks (node -> ../lib/node_modules/..., python3 ->
      # python3.12) and executable bits that a naive copy flattens, producing a
      # tree that looks right and fails on first use.
      # THE RUNTIMES ARE SHIPPED ONCE, INSIDE THE LAUNCHER, and this is the whole
      # reason build_assets/runtimes is not copied in beside them. build-mac.sh
      # already embeds them at Contents/Resources/runtimes, and tray.py resolves
      # that path first when frozen, so a second copy at canon_app/build_assets
      # would be 262 MB of bytes nothing reads. Shipping both took the package
      # from 367 MB to 594 MB, measured. Stripping them from the .app instead
      # would be worse: it breaks the code signature that seals its Resources.
      # SINGLE-APP PACKAGE (macOS): the zip carries ONE thing, the .app, which itself carries
      # the whole tree (Resources/canon-tree), the runtimes, and the prebuilt dashboard. The
      # operator unzips, drops their .env beside the app, and opens it; tray.py materializes
      # the tree to Application Support on first launch and runs from there.
      - name: Assemble package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="canon_app/dist/Strategi Canon.app"
          RT="$APP/Contents/Resources/runtimes"
          TREE="$APP/Contents/Resources/canon-tree"
          test -x "$RT/node/bin/node" || { echo "bundled node missing from the app"; exit 1; }
          test -x "$RT/python/bin/python3" || { echo "bundled python missing from the app"; exit 1; }
          test -f "$TREE/launcher.py" || { echo "canon-tree missing launcher.py"; exit 1; }
          test -f "$TREE/server/app.py" || { echo "canon-tree missing server/app.py"; exit 1; }
          test -f "$TREE/dashboard/.next/standalone/server.js" || { echo "canon-tree missing the prebuilt dashboard"; exit 1; }
          test -f "$TREE/.canon-tree-stamp" || { echo "canon-tree missing its stamp"; exit 1; }
          # A release carrying server/.env would leak the Supabase service key to everyone
          # with repo access. git archive cannot include it; this asserts it rather than
          # trusting it.
          test ! -e "$TREE/server/.env" || { echo "REFUSING: server/.env is in the app"; exit 1; }
          ASSET="$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${{ matrix.artifact }}.zip" >> "$GITHUB_ENV"

      # SINGLE-APP (Windows): wrap the onedir app (exe + runtimes + embedded canon-tree) in ONE
      # installer, Strategi-Canon-windows-setup.exe, so the Windows download is a single file the
      # operator runs once, not a folder they unzip and dig through. Per-user install, no admin
      # prompt (canon.iss says why).
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rt = "canon_app\dist\Strategi Canon\runtimes"
          $tree = "canon_app\dist\Strategi Canon\canon-tree"
          if (!(Test-Path (Join-Path $rt "node\node.exe"))) { throw "bundled node missing from the app" }
          if (!(Test-Path (Join-Path $rt "python\python.exe"))) { throw "bundled python missing from the app" }
          if (!(Test-Path (Join-Path $tree "launcher.py"))) { throw "canon-tree missing launcher.py" }
          if (!(Test-Path (Join-Path $tree "server\app.py"))) { throw "canon-tree missing server/app.py" }
          if (!(Test-Path (Join-Path $tree "dashboard\.next\standalone\server.js"))) { throw "canon-tree missing the prebuilt dashboard" }
          if (Test-Path (Join-Path $tree "server\.env")) { throw "REFUSING: server/.env is in the app" }
          # Inno Setup is not preinstalled; choco is. iscc lands in Program Files (x86).
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }
          & $iscc "/DMyAppVersion=$version" "canon_app\canon.iss"
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          $exe = "canon_app\Strategi-Canon-windows-setup.exe"
          if (!(Test-Path $exe)) { throw "installer was not produced" }
          $dest = Join-Path $env:GITHUB_WORKSPACE "Strategi-Canon-windows-setup.exe"
          Move-Item -Force $exe $dest
          "ASSET=$dest" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "ASSET_NAME=Strategi-Canon-windows-setup.exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Report package size
        shell: bash
        run: ls -lh "$ASSET"

      # TAG ONLY. The small code-only update package (the staged tree: engine + prebuilt dashboard,
      # NO runtimes) goes to the private 'releases' Supabase bucket, so the desktop app's "Update
      # now" fetches tens of MB, not the 300 MB installer. Unified bash (git-bash exists on the
      # Windows runner too). Hashing/JSON use openssl + printf, NOT python: git-bash tar/curl want
      # POSIX paths while Windows python wants backslash paths, and mixing the two is what broke the
      # Windows leg once. See app_update.py and migration 029.
      #
      # continue-on-error: the app installers are the release deliverable; this publish is a
      # nice-to-have. A failure here shows red but must NEVER skip the Attach-to-release step below,
      # which is exactly how a broken publish step once shipped a release with no Windows asset.
      - name: Publish update package to Supabase (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "SUPABASE_URL / SUPABASE_SECRET_KEY repo secrets are not set."
            echo "Skipping update-package publish; add them to enable in-app updates."
            exit 0
          fi
          # The Windows runner hands CANON_TREE and RUNNER_TEMP as Windows paths (D:\a\...), which
          # git-bash tar/curl cannot write ("Cannot write: Broken pipe"). cygpath makes them POSIX;
          # it does not exist on macOS, where the paths are already POSIX, so that branch is a no-op.
          if command -v cygpath >/dev/null 2>&1; then
            CANON_TREE="$(cygpath -u "$CANON_TREE")"
            TMP="$(cygpath -u "$RUNNER_TEMP")"
          else
            TMP="$RUNNER_TEMP"
          fi
          case "$RUNNER_OS" in
            macOS)   PLATFORM=macos ;;
            Windows) PLATFORM=windows ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "$CANON_TREE/launcher.py" || { echo "staged tree missing launcher.py"; exit 1; }
          test -f "$CANON_TREE/VERSION" || { echo "staged tree missing VERSION"; exit 1; }
          test ! -e "$CANON_TREE/server/.env" || { echo "REFUSING: server/.env in the update package"; exit 1; }
          PKG="$TMP/canon-update.tar.gz"
          tar -czf "$PKG" -C "$CANON_TREE" .
          # openssl (on both macOS and git-bash) takes the same POSIX path tar/curl use, so there is
          # no python-wants-backslashes split. Same digest as app_update.py's hashlib.sha256.
          SHA=$(openssl dgst -sha256 "$PKG" | awk '{print $NF}')
          BASE="${SUPABASE_URL%/}/storage/v1/object/releases/latest/$PLATFORM"
          echo "Publishing $PLATFORM update v$VERSION ($(wc -c < "$PKG") bytes, sha256 $SHA)"
          # Package first, THEN manifest, so a reader never sees a manifest pointing at a package
          # that is not up yet. x-upsert overwrites the previous 'latest'.
          curl -fsS -X POST "$BASE/canon-update.tar.gz" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "x-upsert: true" -H "Content-Type: application/gzip" \
            --data-binary @"$PKG" >/dev/null
          MANIFEST="$TMP/manifest.json"
          printf '{"version":"%s","sha256":"%s","published":"%s"}\n' \
            "$VERSION" "$SHA" "$GITHUB_REF_NAME" > "$MANIFEST"
          curl -fsS -X POST "$BASE/manifest.json" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "x-upsert: true" -H "Content-Type: application/json" \
            --data-binary @"$MANIFEST" >/dev/null
          echo "Published $PLATFORM update v$VERSION."

      # DISPATCH ONLY, and best-effort. This lets a human download a build that has
      # no release. continue-on-error because the Actions artifact quota (separate
      # from release-asset storage) can be full, and a quota miss must never fail a
      # build that actually produced a working package. The tag path skips this
      # entirely and attaches straight to the release below.
      - name: Upload dispatch artifact (inspection only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      # TAG ONLY. Each matrix leg appends its own zip to the release for this tag.
      # softprops creates the release on the first leg and updates it on the second,
      # so both platform zips land on one release with no artifact hop between them.
      # The body is identical from both legs, so whichever writes it last is correct.
      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          body: |
            Everything the engine needs is inside: you do NOT need to install
            Node or Python.

            **macOS: one app.** Download `Strategi-Canon-macos.zip`, unzip it,
            put "Strategi Canon.app" anywhere (Applications is fine). Open the
            app; it sets itself up in ~/Library/Application Support on first
            launch. The app is unsigned, so the first open needs right-click (or
            Control-click) > Open > Open. Once only.

            **Windows: one installer.** Download
            `Strategi-Canon-windows-setup.exe` and run it. It installs for your
            user (no admin prompt), adds a Start-menu entry, and can start at
            login. SmartScreen shows "Windows protected your PC" the first time:
            More info > Run anyway. Once only.

            **Signing in:** if your deployment is set up for it, the app asks you
            to sign in with your Canon account on first launch and fetches its
            keys itself, so there is no `.env` file to place. Otherwise, put the
            `.env` from your admin beside the app (macOS: same folder as the app,
            as `.env` or `canon.env`; Windows: in the installed folder).

            You still need, one time: **Claude Code, logged in with your own
            account.** This is what pays for generation, out of your own
            subscription. Install it from https://claude.com/claude-code, run
            `claude`, log in, type `/exit`.

            The dashboard ships pre-built, so it comes up in a second or two
            with no compile step. First start still spends a minute or two
            building the Python environment; after that, starts are seconds.
            Turn on "Start at login" so it stays running in the background,
            ready the moment you open it.

            **Updating:** open Settings (the gear at the bottom of the sidebar)
            to see your version and, when a newer release exists, "Update now".
            It downloads only the changed code (tens of MB, not the whole app),
            keeps your keys and work, and applies on the next Restart. No
            re-download, no reinstall, no re-entering keys.
